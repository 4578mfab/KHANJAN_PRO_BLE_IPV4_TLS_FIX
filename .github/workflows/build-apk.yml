name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create . --project-name khanjan_iot_home --org com.khanjan.iot

      - name: Fix Kotlin version
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle || true
          fi
          if [ -f android/build.gradle ]; then
            sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/" android/build.gradle || true
            sed -i 's/ext.kotlin_version = "[^"]*"/ext.kotlin_version = "1.9.24"/' android/build.gradle || true
          fi

      - name: Configure Android BLE + Release stability
        run: |
          # minSdk برای BLE
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle

          # JitPack برای کتابخانه ESP
          if [ -f android/build.gradle ]; then
            grep -q 'jitpack.io' android/build.gradle || \
            sed -i '/mavenCentral()/a\ maven { url "https://jitpack.io" }' android/build.gradle
          fi

          # غیرفعال کردن minify برای جلوگیری از خراب شدن Session
          if [ -f android/app/build.gradle ]; then
            # اگر minifyEnabled true بود، false می‌کنیم
            sed -i 's/minifyEnabled true/minifyEnabled false/' android/app/build.gradle || true
            sed -i 's/shrinkResources true/shrinkResources false/' android/app/build.gradle || true

            # اگر اصلاً نبود، اضافه می‌کنیم
            if ! grep -q 'minifyEnabled' android/app/build.gradle; then
              sed -i '/release {/a\ minifyEnabled false\n shrinkResources false' android/app/build.gradle || true
            fi
          fi

      - name: Verify JitPack repository
        run: |
          echo "Checking JitPack..."
          grep -n -A 5 -B 2 'jitpack.io' android/build.gradle || true
          echo "Checking minify settings..."
          grep -n -A 6 'release {' android/app/build.gradle || true

      - name: Get dependencies
        run: flutter pub get
      - name: Apply secure IPv4 MQTT transport patch
        run: python3 tool/patch_mqtt_client_tls.py
      - name: Check ESP Provisioning Version
        run: |
          grep -A 8 'esp_provisioning_wifi:' pubspec.lock                  
      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: khanjan-iot-home-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
